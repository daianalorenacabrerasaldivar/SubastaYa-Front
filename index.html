<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubastaYa — Subastas en línea</title>

  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/home.css">
</head>
<body>

  <div id="app-header"></div>

  <main class="page-content">

    <!-- Hero -->
    <div class="home-hero">
      <h1>Subastas en línea</h1>
      <p>Ofertá en tiempo real. El mayor postor se lleva el artículo.</p>
    </div>

    <!-- Filtros -->
    <div class="filtros-bar">
      <div class="filtros-tabs">
        <button class="tab active" data-status="">Todas</button>
        <button class="tab" data-status="Activas">Activas</button>
        <button class="tab" data-status="Proximas">Próximas</button>
        <button class="tab" data-status="Finalizadas">Finalizadas</button>
      </div>
      <div class="filtros-sort">
        <select id="sort-select">
          <option value="TiempoRestante">Ordenar: Tiempo restante</option>
          <option value="MayorPuja">Ordenar: Mayor puja</option>
        </select>
      </div>
    </div>

    <!-- Estado de carga -->
    <div id="estado-carga" class="estado-carga">
      <div class="spinner"></div>
    </div>

    <!-- Grid de subastas (llenado por home.js) -->
    <div id="auctions-grid" class="card-grid"></div>

  </main>

  <div id="app-footer"></div>

  <script src="./components/layout.js" type="module"></script>
  <script src="./scripts/home.js" type="module"></script>

</body>
</html>
