<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera — SubastaYa</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/wallet.css">
</head>
<body>

  <div id="app-header"></div>

  <main class="page-content">

    <div class="wallet-header">
      <h1>Mi billetera</h1>
      <p>Consultá tu saldo y cargá crédito para participar en subastas.</p>
    </div>

    <!-- Ingreso de usuario -->
    <div class="form-card" style="max-width:480px; margin-bottom:32px">
      <h2>Identificate</h2>
      <div style="display:flex; gap:8px">
        <input id="input-usuario" type="number" min="1" class="form-control"
               placeholder="Tu ID de usuario (Ej: 5)">
        <button id="btn-cargar" class="btn btn-primary" style="white-space:nowrap">
          Ver billetera
        </button>
      </div>
    </div>

    <!-- Layout: historial + panel -->
    <div id="panel-datos" hidden>
      <div class="wallet-layout">

        <!-- Historial de transacciones -->
        <section class="wallet-historial">
          <h2>Movimientos</h2>
          <div id="tx-lista" class="tx-lista">
            <p class="tx-vacio">Todavía no hay movimientos.</p>
          </div>
        </section>

        <!-- Panel: saldo + depósito -->
        <aside class="wallet-panel">

          <!-- Tarjeta de saldo -->
          <div class="saldo-card">
            <p class="saldo-label">Saldo disponible</p>
            <p id="saldo-valor" class="saldo-valor">$0</p>
            <p id="saldo-usuario" class="saldo-usuario">Usuario #—</p>
          </div>

          <!-- Formulario de depósito -->
          <div class="deposito-card">
            <h2>Depositar crédito</h2>

            <div class="montos-rapidos">
              <button class="monto-chip" data-monto="1000">$1.000</button>
              <button class="monto-chip" data-monto="5000">$5.000</button>
              <button class="monto-chip" data-monto="10000">$10.000</button>
              <button class="monto-chip" data-monto="50000">$50.000</button>
            </div>

            <div class="form-group">
              <label class="form-label" for="input-monto">Monto a depositar ($)</label>
              <input id="input-monto" type="number" min="1" step="1" class="form-control"
                     placeholder="Ej: 5000">
            </div>

            <div id="alerta-deposito"></div>

            <button id="btn-depositar" class="btn btn-primary btn-full">
              Depositar
            </button>
          </div>

        </aside>
      </div>
    </div>

  </main>

  <div id="app-footer"></div>

  <script src="../components/layout.js" type="module"></script>
  <script src="../scripts/wallet.js" type="module"></script>

</body>
</html>
